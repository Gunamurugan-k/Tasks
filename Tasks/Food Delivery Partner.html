<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 13 - Food Delivery App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body{ background:#fafafa; font-family:'Segoe UI',Arial,sans-serif; }
  .phone-frame{ max-width:380px; margin:2rem auto; border:10px solid #1a1a1a; border-radius:36px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .app-header{ background:#ff4d3d; color:#fff; padding:1.2rem 1rem 1.6rem; border-radius:0 0 20px 20px; }
  .search-pill{ background:#fff; border-radius:12px; }
  .promo-banner{ background:#fff4e6; border-radius:12px; }
  .cat-icon{ width:56px; height:56px; background:#ffe8e5; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#ff4d3d; font-size:1.4rem; margin:0 auto; }
  .rest-card{ border-radius:14px; border:1px solid #eee; overflow:hidden; }
  .rest-img{ background:#ddd; height:110px; }
  .bottom-nav{ background:#fff; border-top:1px solid #eee; }
  .bottom-nav i{ font-size:1.3rem; color:#999; }
  .bottom-nav .active i{ color:#ff4d3d; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="app-header">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div><p class="small mb-0">Deliver to</p><p class="fw-semibold mb-0"><i class="bi bi-geo-alt-fill"></i> Salem, Tamil Nadu</p></div>
      <i class="bi bi-person-circle fs-4"></i>
    </div>
    <div class="search-pill d-flex align-items-center px-3 py-2">
      <i class="bi bi-search text-secondary me-2"></i>
      <input class="form-control border-0 p-0" placeholder="Search restaurants or dishes">
    </div>
  </div>

  <div class="p-3">
    <div class="promo-banner p-3 mb-3 d-flex justify-content-between align-items-center">
      <div><p class="fw-bold mb-0">50% OFF</p><p class="small mb-0">up to ₹100 on first order</p></div>
      <i class="bi bi-bag-heart fs-2 text-warning"></i>
    </div>

    <div class="d-flex justify-content-between mb-3 text-center">
      <div><div class="cat-icon"><i class="bi bi-egg-fried"></i></div><p class="small mt-1 mb-0">Breakfast</p></div>
      <div><div class="cat-icon"><i class="bi bi-cup-straw"></i></div><p class="small mt-1 mb-0">Beverages</p></div>
      <div><div class="cat-icon"><i class="bi bi-pie-chart"></i></div><p class="small mt-1 mb-0">Pizza</p></div>
      <div><div class="cat-icon"><i class="bi bi-basket"></i></div><p class="small mt-1 mb-0">Groceries</p></div>
    </div>

    <h6 class="fw-bold mb-2">Popular Near You</h6>
    <div class="rest-card mb-3">
      <div class="rest-img"></div>
      <div class="p-2">
        <div class="d-flex justify-content-between"><span class="fw-semibold">Spice Garden</span><span class="small text-success">★ 4.3</span></div>
        <p class="small text-muted mb-0">South Indian • 30 min • ₹200 for two</p>
      </div>
    </div>
    <div class="rest-card mb-3">
      <div class="rest-img"></div>
      <div class="p-2">
        <div class="d-flex justify-content-between"><span class="fw-semibold">Pizza Bay</span><span class="small text-success">★ 4.1</span></div>
        <p class="small text-muted mb-0">Italian • 25 min • ₹350 for two</p>
      </div>
    </div>
  </div>

  <div class="bottom-nav d-flex justify-content-around py-2">
    <div class="text-center active"><i class="bi bi-house-door-fill"></i></div>
    <div class="text-center"><i class="bi bi-search"></i></div>
    <div class="text-center"><i class="bi bi-bag"></i></div>
    <div class="text-center"><i class="bi bi-person"></i></div>
  </div>
</div>
</body>
</html>
