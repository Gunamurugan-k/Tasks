<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 1 - Facebook Login Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{ background:#f0f2f5; font-family:'Segoe UI', Helvetica, Arial, sans-serif; }
  .fb-logo{ color:#1877f2; font-size:3.5rem; font-weight:800; letter-spacing:-1px; }
  .fb-tagline{ color:#1c1e21; font-size:1.6rem; max-width:400px; }
  .login-card{ border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.2); max-width:396px; }
  .btn-fb{ background:#1877f2; border-color:#1877f2; font-weight:700; font-size:1.1rem; }
  .btn-fb:hover{ background:#166fe5; }
  .btn-create{ background:#42b72a; border-color:#42b72a; font-weight:700; }
  .btn-create:hover{ background:#36a420; }
  .form-control{ padding:.75rem 1rem; font-size:1.05rem; }
  hr.divider{ margin:1.25rem 0; }
</style>
</head>
<body>
<div class="container">
  <div class="row min-vh-100 align-items-center">
    <div class="col-lg-6 mb-5 mb-lg-0 text-center text-lg-start">
      <div class="fb-logo">facebook</div>
      <p class="fb-tagline mt-2">Facebook helps you connect and share with the people in your life.</p>
    </div>
    <div class="col-lg-5 offset-lg-1">
      <div class="card login-card p-3 mx-auto">
        <div class="card-body">
          <form>
            <input type="text" class="form-control mb-2" placeholder="Email address or phone number">
            <input type="password" class="form-control mb-3" placeholder="Password">
            <button type="submit" class="btn btn-fb w-100 py-2">Log In</button>
            <div class="text-center mt-3">
              <a href="#" class="text-decoration-none small text-primary">Forgotten password?</a>
            </div>
            <hr class="divider">
            <div class="text-center">
              <button type="button" class="btn btn-create px-4 py-2">Create new account</button>
            </div>
          </form>
        </div>
      </div>
      <p class="text-center mt-4 small">
        <strong>Create a Page</strong> for a celebrity, brand or business.
      </p>
    </div>
  </div>
</div>
</body>
</html>
