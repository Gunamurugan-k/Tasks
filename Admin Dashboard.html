<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 11 - Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body{ background:#f4f6f9; font-family:'Segoe UI',Arial,sans-serif; }
  .sidebar{ background:#1e2a38; color:#fff; min-height:100vh; width:230px; }
  .sidebar .nav-link{ color:#c5d0dc; }
  .sidebar .nav-link.active, .sidebar .nav-link:hover{ background:#2b3a4d; color:#fff; border-radius:6px; }
  .topbar{ background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stat-card{ border-radius:10px; border:none; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stat-icon{ width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:#fff; }
  table thead{ background:#f8f9fa; }
  .badge-status{ font-size:.75rem; }
</style>
</head>
<body>
<div class="d-flex">
  <div class="sidebar p-3">
    <h5 class="mb-4">Admin<span class="text-info">Panel</span></h5>
    <a class="nav-link active mb-1 px-2 py-2" href="#"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a class="nav-link mb-1 px-2 py-2" href="#"><i class="bi bi-people me-2"></i>Users</a>
    <a class="nav-link mb-1 px-2 py-2" href="#"><i class="bi bi-bag-check me-2"></i>Orders</a>
    <a class="nav-link mb-1 px-2 py-2" href="#"><i class="bi bi-bar-chart me-2"></i>Analytics</a>
    <a class="nav-link mb-1 px-2 py-2" href="#"><i class="bi bi-gear me-2"></i>Settings</a>
  </div>

  <div class="flex-grow-1">
    <div class="topbar d-flex justify-content-between align-items-center px-4 py-3">
      <h5 class="mb-0">Dashboard Overview</h5>
      <div class="d-flex gap-3 align-items-center">
        <i class="bi bi-bell"></i>
        <span class="rounded-circle bg-info text-white d-inline-flex align-items-center justify-content-center" style="width:34px;height:34px;">G</span>
      </div>
    </div>

    <div class="container-fluid p-4">
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
            <div class="stat-icon" style="background:#4e73df;"><i class="bi bi-people"></i></div>
            <div><p class="small text-muted mb-0">Total Users</p><h5 class="mb-0">12,480</h5></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
            <div class="stat-icon" style="background:#1cc88a;"><i class="bi bi-currency-rupee"></i></div>
            <div><p class="small text-muted mb-0">Revenue</p><h5 class="mb-0">₹8.4L</h5></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
            <div class="stat-icon" style="background:#f6c23e;"><i class="bi bi-bag-check"></i></div>
            <div><p class="small text-muted mb-0">Orders</p><h5 class="mb-0">3,210</h5></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
            <div class="stat-icon" style="background:#e74a3b;"><i class="bi bi-exclamation-triangle"></i></div>
            <div><p class="small text-muted mb-0">Pending</p><h5 class="mb-0">47</h5></div>
          </div>
        </div>
      </div>

      <div class="card stat-card p-3">
        <h6 class="mb-3">Recent Orders</h6>
        <table class="table table-hover align-middle">
          <thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>#10234</td><td>Arul.K</td><td>₹1,999</td><td><span class="badge bg-success badge-status">Delivered</span></td></tr>
            <tr><td>#10235</td><td>Amudhan.R</td><td>₹2,499</td><td><span class="badge bg-warning text-dark badge-status">Pending</span></td></tr>
            <tr><td>#10236</td><td>Guna.K</td><td>₹899</td><td><span class="badge bg-danger badge-status">Cancelled</span></td></tr>
            <tr><td>#10237</td><td>Gokul.S</td><td>₹3,150</td><td><span class="badge bg-success badge-status">Delivered</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
